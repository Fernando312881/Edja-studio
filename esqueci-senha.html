<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Edja Studio</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .form-container { 
            background: white;
            max-width: 400px; 
            width: 100%;
            margin: 20px; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }
        .form-container h2 {
            color: var(--secondary-color);
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        .form-container p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .form-group { margin-bottom: 25px; }
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600;
            color: var(--secondary-color);
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }
        .form-group input { 
            width: 100%; 
            padding: 12px 12px 12px 40px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            font-size: 1rem;
        }
        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background-color: #b57a77;
        }
        .back-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.95rem;
        }
        .back-link a {
            color: var(--primary-color);
            font-weight: 600;
        }
        .success-box {
            background-color: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div id="requestForm">
            <h2>Recuperar Senha</h2>
            <p>Insira seu e-mail e enviaremos um link para você redefinir sua senha.</p>
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label>E-mail</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" required placeholder="seu@email.com">
                    </div>
                </div>
                <button type="submit" class="btn-submit">Enviar Link</button>
            </form>
            <p class="back-link"><a href="login.html"><i class="fas fa-arrow-left"></i> Voltar para o login</a></p>
        </div>
        <div id="successBox" class="success-box">
            <i class="fas fa-paper-plane fa-3x" style="margin-bottom: 15px;"></i>
            <h3>E-mail Enviado!</h3>
            <p>Se este e-mail estiver cadastrado, você receberá um link em breve.</p>
            <p class="back-link"><a href="login.html">Voltar para o login</a></p>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = e.target.querySelector('button');

            try {
                btn.disabled = true;
                btn.innerText = 'Enviando...';
                await apiService.auth.forgotPassword(email);
                document.getElementById('requestForm').style.display = 'none';
                document.getElementById('successBox').style.display = 'block';
            } catch (err) {
                alert('Erro: ' + err.message);
                btn.disabled = false;
                btn.innerText = 'Enviar Link';
            }
        });
    </script>
</body>
</html>
